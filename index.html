<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ClassIQ: assignments, exams, courses and messages for teachers and students.">
  <meta name="theme-color" content="#121824">
  <title>ClassIQ Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="is-restoring">

  <!-- THE OFFICIAL COLORED BRAND LOGO -->
  <div id="site-logo">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="crestBlue" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#3b82f6"/>
          <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>
        <linearGradient id="tasselGold" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#fbbf24"/>
          <stop offset="100%" stop-color="#b45309"/>
        </linearGradient>
      </defs>
      <path d="M6 10C6 7.79086 7.79086 6 10 6H38C40.2091 6 42 7.79086 42 10V26C42 34.8366 34.8366 42 26 42H22C13.1634 42 6 34.8366 6 26V10Z" fill="url(#crestBlue)"/>
      <path d="M11 11C11 9.34315 12.3431 8 14 8H34C35.6569 8 37 9.34315 37 11V25C37 31.0751 32.0751 36 26 36H22C15.9249 36 11 31.0751 11 25V11Z" fill="white" fill-opacity="0.05"/>
      <path d="M24 13L37 19L24 25L11 19L24 13Z" fill="#ffffff"/>
      <path d="M16 23.5V27.5C16 30.5 19.5 32 24 32C28.5 32 32 30.5 32 27.5V23.5L24 27.2L16 23.5Z" fill="#f8fafc"/>
      <path d="M24 19L33.5 23.2V28.5C33.5 29.5 32.5 30 31.5 29.5C30.5 29 30.5 27.5 30.5 27.5" stroke="url(#tasselGold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="31.5" cy="29.5" r="1.5" fill="url(#tasselGold)"/>
    </svg>
  </div>

  <!-- 1. AUTHENTICATION CONTAINER -->
  <main id="auth-wrapper">
    <div id="title">ClassIQ</div>
    
    <div id="login-signup-container" class="glass-panel">
     <div id="auth-views">
      <!-- Login Form View (initial state is declared here, not by JS) -->
      <div id="login-form-container" class="auth-view active">
        <h2>Login</h2>
        <form id="login-form" class="input-group" novalidate>
          <input type="text" id="login-username" placeholder="Username or Email" aria-label="Username or email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
          <input type="password" id="login-password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
          <button id="login-submit-btn" type="submit">Login</button>
          <p id="login-message" class="form-message" role="alert"></p>
        </form>
        <div class="auth-switch">
          Don't have an account? <span id="signup-toggle" class="auth-switch-link">Sign Up as a Teacher</span>
        </div>
      </div>

      <!-- Signup Form View -->
      <div id="signup-form-container" class="auth-view">
        <h2>Sign Up</h2>
        <form id="signup-form" class="input-group" novalidate>
          <input type="text" id="signup-name" placeholder="Full Name" aria-label="Full name" autocomplete="name" required>
          <input type="text" id="signup-username" placeholder="Username" aria-label="Username" autocomplete="off" autocapitalize="none" spellcheck="false" required>
          <input type="email" id="signup-email" placeholder="Email Address" aria-label="Email address" autocomplete="email" required>
          <input type="text" id="signup-school" placeholder="School Name" aria-label="School name" autocomplete="organization">
          <input type="password" id="signup-password" placeholder="Password" aria-label="Password" autocomplete="new-password" required>
          <button id="signup-submit-btn" type="submit">Sign Up</button>
          <p id="signup-message" class="form-message" role="alert"></p>
        </form>
        <div class="auth-switch">
          Already have an account? <span id="login-toggle" class="auth-switch-link">Login</span>
        </div>
      </div>
     </div>
    </div>
  </main>

    <!-- 2. MAIN APPLICATION PLATFORM -->
  <div id="app-main" style="display: none;">
    <div id="dashboard">
    
      
      <!-- SIDEBAR -->
      <aside id="sidebar" class="glass-panel">
        <div id="sidebar-navigation"></div>

        <button id="sidebar-toggle-btn" type="button" aria-label="Toggle Sidebar" aria-expanded="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <nav>
        

          <!-- Assignments -->
          <div class="nav-item">
            <svg id="assignmentsWidget-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
              <path d="M9 12h6M9 16h6M9 8h4"/>
            </svg>
            <span>Assignments</span>
          </div>

          <!-- Exams -->
          <div class="nav-item">
            <svg id="examsWidget-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <polyline points="9 15 11 17 15 13"/>
            </svg>
            <span>Exams</span>
          </div>

          <!-- Courses / Manage Courses -->
          <div class="nav-item">
            <svg id="coursesWidget-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
            <span>Courses</span>
          </div>

          <!-- Mailbox / Teacher Mailbox -->
          <div class="nav-item">
            <svg id="mailboxWidget-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
              <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
            </svg>
            <span>Mailbox</span>
          </div>

          <!-- Notifications -->
          <div class="nav-item">
            <svg id="notificationsWidget-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span>Notifications</span>
          </div>

          <!-- Settings -->
          <div class="nav-item" id="nav-settings">
            <!-- id="settingsWidget-icon" so the JavaScript can reuse it -->
            <svg id="settingsWidget-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span>Settings</span>
          </div>
        </nav>
      </aside>


      <!-- TOPBAR -->
      <header id="top-bar">
        <div class="student-meta">
          <div id="name"></div>
          <div id="school-name"></div>
        </div>

        <div class="top-bar-widgets-group">
          <button id="mailbox" class="top-bar-widget" type="button" aria-label="Mailbox">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          </button>
          <button id="notifications" class="top-bar-widget" type="button" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </button>

          <button id="info" class="top-bar-widget" type="button" aria-label="Information">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>

          </button>

          <!-- Quick Action Logout Button Session -->
          <button id="logout-btn" class="top-bar-widget" type="button" title="Logout" aria-label="Logout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          </button>

        </div>
      </header>

      <!-- MAIN WORKSPACE CONTENT AREA -->
      <section id="widget-container"></section>

      <!-- THE FULL WINDOW SUBJECT DETAILS PORTAL PANEL OVERLAY -->
<div id="subject-detail-modal" class="full-section" role="dialog" aria-modal="true" aria-labelledby="section-label" aria-hidden="true">
  
  <!-- 1. The Global Section Header Label Block -->
  <div id="section-label">Placeholder</div>

  

  <!-- 3. RIGHT MAIN CONTENT CANVASES GO HERE (Optional placeholder for balance) -->
  <main class="modal-main-content">
    <div class="empty-state-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      <p id="subtext">Placeholder</p>
    </div>
    <div id="section-list" class="section-list"></div>
  </main>

  <!-- 4. CLOSE BUTTON: Kept inside the modal layout tree. 
       Removed 'display: none' inline style so your CSS transitions handle visibility correctly -->
  <div id="close-button" aria-label="Close section">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </div>

</div> <!-- Clean wrapper closure for #subject-detail-modal -->
         
      
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
